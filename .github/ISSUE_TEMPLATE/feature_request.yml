name: ✨ Feature Request
description: 提议新功能、改进体验或提出对现有功能的优化建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出你的想法 ✨
        请描述清楚「你想要什么」「为什么需要」「怎样才算做好」。
  - type: checkboxes
    id: pre_check
    attributes:
      label: ✅ 提交前自检清单
      options:
        - label: 我已搜索过 [现有 Issue](https://github.com/YEHE-Team/FluxWorker/issues?q=is%3Aissue+label%3Aenhancement) ，确认这不是已存在的请求
          required: true
        - label: 我已阅读 [README](https://github.com/YEHE-Team/FluxWorker#readme) 的功能列表，确认这不是已实现功能
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: |
        描述当前的工作流中让你感到痛的地方。
        越具体越好——不要只说「不够好用」，说清楚「哪里不好用」。
      placeholder: |
        例：当我需要在 5 个项目之间切换会话时，目前必须打开 5 个独立窗口，
        期望能在一个窗口里用 Tab 切换。
    validations:
      required: true
  - type: textarea
    id: target_user
    attributes:
      label: 目标用户与使用场景
      description: |
        描述这个功能主要服务于谁、在什么场景下使用。
        区分「个人使用」、「小团队」、「企业协作」等不同规模。
      placeholder: |
        - 目标用户：独立开发者 / 5 人小团队 / 大型企业
        - 使用场景：在多项目并行开发时需要快速切换工作上下文
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你认为最理想的功能形态（可以画 ASCII 草图或贴 UI 草稿）
      placeholder: |
        例：在主窗口顶部加一个 Tab 栏，每个 Tab 独立维护会话状态，
        支持拖拽排序、快捷键 Ctrl+1~5 切换。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他实现方式，或当前用过的 workaround
    validations:
      required: false
  - type: input
    id: related
    attributes:
      label: 相关 Issue / 讨论链接（可选）
      description: 与本请求相关的现有 Issue、Discussion 或 PR
      placeholder: "#3, #12, https://github.com/YEHE-Team/FluxWorker/discussions/5"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: 功能分类
      description: 建议的功能归属
      options:
        - 🤖 AI Agent 能力
        - 🛠️ 工具集（Tools）
        - ⚡ 斜杠命令（Slash Commands）
        - 🎨 UI / 交互
        - 🔌 MCP 协议集成
        - 🔐 安全 / 权限
        - 📦 多会话管理
        - 🌐 国际化 / 本地化
        - 📖 文档
        - 🧰 其他
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级（自评）
      description: 你认为这个功能的优先级
      options:
        - 🔥 高（强烈影响日常工作流）
        - ⭐ 中（会带来明显提升）
        - 💡 低（锦上添花）
    validations:
      required: true
  - type: dropdown
    id: will_pr
    attributes:
      label: 是否愿意提交 PR
      description: 如果你愿意实现该功能，请勾选
      options:
        - ✅ 是，我愿意在维护者 review 后提交 PR
        - 💬 我可以贡献设计方案，但需要协助编码
        - ❌ 否，仅提供建议
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 参考实现（可选）
      description: 其他产品或工具的类似功能截图、链接
    validations:
      required: false
