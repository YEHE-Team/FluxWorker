name: 🐛 Bug Report
description: 报告 FluxWorker 的功能异常、性能问题、界面错误或崩溃
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告 🐛
        填写前请确认以下事项——**信息越完整，越容易被复现和修复**。
  - type: checkboxes
    id: pre_check
    attributes:
      label: ✅ 提交前自检清单
      description: 请逐项勾选已完成的步骤（未勾选可能会被要求补充）
      options:
        - label: 我已搜索过 [现有 Issue](https://github.com/YEHE-Team/FluxWorker/issues) ，确认这不是重复报告
          required: true
        - label: 我已阅读 [README](https://github.com/YEHE-Team/FluxWorker#readme) 中的故障排除章节，未找到解决方案
          required: true
        - label: 我使用的是最新版本（已升级到最新 Release 后问题依然存在）
          required: true
  - type: input
    id: version
    attributes:
      label: FluxWorker 版本号
      description: 在「关于」页面可看到，例如 v1.0.8
      placeholder: v1.0.8
    validations:
      required: true
  - type: input
    id: first_version
    attributes:
      label: 问题首次出现的版本
      description: 如果记得是哪个版本开始出现的，请填写；不知道可填「不详」
      placeholder: v1.0.5 / 不详
    validations:
      required: false
  - type: input
    id: last_good_version
    attributes:
      label: 最后正常工作的版本
      description: 如果升级后才出现的，请填升级前的版本
      placeholder: v1.0.7
    validations:
      required: false
  - type: dropdown
    id: reproducibility
    attributes:
      label: 是否可稳定复现
      description: 自评问题出现的频率
      options:
        - 必现（每次操作都出现）
        - 偶发（操作多次偶尔出现）
        - 仅一次（无法主动复现）
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 出现问题的客户端系统
      options:
        - Windows 11
        - Windows 10
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Ubuntu 20.04
        - 其他 Linux 发行版
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: 系统架构
      description: 处理器架构
      placeholder: x64 / arm64
    validations:
      required: false
  - type: input
    id: electron
    attributes:
      label: Electron 版本（可选）
      description: 在「关于」→「技术信息」中可查
      placeholder: 31.0.0
    validations:
      required: false
  - type: input
    id: window
    attributes:
      label: 窗口尺寸 / DPI 缩放（可选）
      description: 例：1440x900，DPI 100% / 150%
      placeholder: 1440x900, DPI 100%
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 用 1~3 句话清晰描述问题
      placeholder: |
        例：在打开多会话窗口时，第三个会话的输入框无法获得焦点。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 列出从启动到出现问题的完整操作步骤
      placeholder: |
        1. 打开 FluxWorker
        2. 依次点击「新建会话」三次
        3. 切换到第三个会话
        4. 观察输入框焦点状态
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么（截图、报错信息请粘贴在这里）
    validations:
      required: true
  - type: input
    id: attachments
    attributes:
      label: 截图 / 录屏（可选）
      description: |
        请在 issue 描述中直接拖拽上传图片 / 视频文件。
        关键路径：报错弹窗、异常界面、调试控制台输出等。
      placeholder: 直接拖入图片或视频即可
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        可在以下位置找到日志：
        - Windows：`%APPDATA%\fluxworker\logs\`
        - macOS：`~/Library/Logs/fluxworker/`
        - Linux：`~/.config/fluxworker/logs/`
      placeholder: |
        ```
        [2026-05-29 14:32:11] ERROR ...
        ```
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: 自评问题的影响范围
      options:
        - 🔴 严重（无法使用核心功能 / 数据丢失 / 崩溃）
        - 🟠 高（功能受损但有 workaround）
        - 🟡 中（影响体验但不影响主流程）
        - 🟢 低（文字、样式、细节问题）
    validations:
      required: true
