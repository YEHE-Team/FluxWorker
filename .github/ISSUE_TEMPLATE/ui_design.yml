name: 🎨 UI / Design Issue
description: 报告界面布局、视觉样式、交互逻辑、动效、字体图标等问题
title: "[UI]: "
labels: ["ui", "enhancement", "triage"]
body:
  - type: checkboxes
    id: pre_check
    attributes:
      label: ✅ 提交前自检清单
      options:
        - label: 我已搜索过现有 UI Issue，确认这不是重复报告
          required: true
        - label: 我已尝试切换不同窗口尺寸 / DPI / 主题
          required: true
  - type: dropdown
    id: ui_type
    attributes:
      label: 问题类别
      options: [📐 布局, 🎨 颜色, 🔤 字体, 🪟 窗口控制, 🖱️ 交互, 📱 响应式, ♿ 无障碍, 🌐 国际化, 🧩 其他]
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 受影响组件
      placeholder: 顶部 Tab 栏 / 设置面板
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows 11, Windows 10, macOS 15, macOS 14, macOS 13, Ubuntu, 其他 Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望效果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际效果
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options: [🔴 严重, 🟠 高, 🟡 中, 🟢 低]
    validations:
      required: true